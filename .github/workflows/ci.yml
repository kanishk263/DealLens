name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: processing/requirements-dev.txt }
      - run: python -m venv processing/.venv && processing/.venv/bin/pip install -r processing/requirements-dev.txt
      - run: npm run test:python

  integration:
    name: Integration tests (local Supabase + worker)
    runs-on: ubuntu-latest
    needs: [web, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: python -m venv processing/.venv && processing/.venv/bin/pip install -r processing/requirements.txt
      - run: cp supabase/.env.example supabase/.env
      - run: npx supabase start -x vector,logflare,studio,imgproxy,edge-runtime,supavisor
      - name: Write local env from the CLI's local keys
        run: |
          npx supabase status -o env > .supabase.env
          . ./.supabase.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "APP_BASE_URL=http://localhost:3200"
          } > .env.local
          {
            echo "DATABASE_URL=$DB_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > processing/.env
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: NODE_OPTIONS=--conditions=react-server npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
